<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOCRA Platform — Architecture Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:    #1565C0;
    --blue-l:  #90caf9;
    --blue-bg: rgba(21,101,192,0.12);
    --purple:    #534AB7;
    --purple-l:  #AFA9EC;
    --purple-bg: rgba(83,74,183,0.12);
    --teal:    #0F6E56;
    --teal-l:  #9FE1CB;
    --teal-bg: rgba(15,110,86,0.12);
    --amber:    #854F0B;
    --amber-l:  #FAC775;
    --amber-bg: rgba(133,79,11,0.12);
    --gray:    #444441;
    --gray-l:  #D3D1C7;
    --gray-bg: rgba(68,68,65,0.10);
    --dark:  #1a1a1a;
    --dark2: #222;
    --border: rgba(255,255,255,0.1);
    --text:   rgba(255,255,255,0.85);
    --muted:  rgba(255,255,255,0.45);
    --font-head: 'Barlow Condensed', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
  }

  .page-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 1rem;
  }

  .logo-text {
    font-family: var(--font-head);
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 4px;
  }

  .logo-dots {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .page-title {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .diagram-wrap {
    width: 100%;
    max-width: 760px;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
  }

  .diagram-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .layer {
    cursor: default;
    transition: filter 0.2s;
  }

  .layer:hover { filter: brightness(1.12); }

  .layer rect {
    transition: stroke-opacity 0.2s;
  }

  .layer:hover rect {
    stroke-opacity: 0.9;
  }

  .conn-label {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: rgba(255,255,255,0.35);
  }

  .node-title {
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 700;
    fill: #fff;
  }

  .node-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: rgba(255,255,255,0.55);
  }

  .docker-title {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    fill: rgba(255,255,255,0.6);
  }

  .docker-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: rgba(255,255,255,0.35);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 1.5rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 2rem;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="logo-wrap">
    <div class="logo-text">BOCRA</div>
    <div class="logo-dots">
      <div class="dot" style="background:#1565C0"></div>
      <div class="dot" style="background:#F9A825"></div>
      <div class="dot" style="background:#2E7D32"></div>
      <div class="dot" style="background:#B71C1C"></div>
    </div>
  </div>
  <div class="page-title">Platform Architecture</div>
</div>

<div class="diagram-wrap">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ── FRONTEND ──────────────────────────────────────────────── -->
    <g class="layer">
      <rect x="60" y="20" width="560" height="94" rx="8"
            fill="rgba(21,101,192,0.13)" stroke="#1565C0" stroke-width="0.8" stroke-opacity="0.6"/>
      <text class="node-title" x="340" y="56" text-anchor="middle">React 18 + TypeScript (Vite) · :5173</text>
      <text class="node-sub" x="340" y="76" text-anchor="middle">React Router v6 · React Query · Framer Motion · Tailwind CSS</text>
      <text class="node-sub" x="340" y="96" text-anchor="middle">Recharts · React Hook Form + Zod · Axios</text>
    </g>

    <!-- ── CONNECTOR: FRONTEND → API ────────────────────────────── -->
    <text class="conn-label" x="340" y="138" text-anchor="middle">Axios · JWT Bearer token</text>
    <line x1="340" y1="114" x2="340" y2="152"
          stroke="#1565C0" stroke-width="1.5" stroke-opacity="0.7"
          marker-end="url(#arr)"/>

    <!-- ── RUST API ───────────────────────────────────────────────── -->
    <g class="layer">
      <rect x="60" y="160" width="560" height="94" rx="8"
            fill="rgba(83,74,183,0.13)" stroke="#534AB7" stroke-width="0.8" stroke-opacity="0.6"/>
      <text class="node-title" x="340" y="196" text-anchor="middle">Rust / Axum API · :8080 · /api/v1</text>
      <text class="node-sub" x="340" y="216" text-anchor="middle">SQLx · Argon2id · jsonwebtoken · Tower middleware</text>
      <text class="node-sub" x="340" y="236" text-anchor="middle">utoipa (Swagger) · Tracing · Tokio async runtime</text>
    </g>

    <!-- ── CONNECTOR: API → POSTGRES ────────────────────────────── -->
    <text class="conn-label" x="198" y="288" text-anchor="middle">SQLx async queries</text>
    <line x1="198" y1="254" x2="198" y2="304"
          stroke="#0F6E56" stroke-width="1.5" stroke-opacity="0.7"
          marker-end="url(#arr)"/>

    <!-- ── CONNECTOR: API → REDIS ────────────────────────────────── -->
    <text class="conn-label" x="482" y="288" text-anchor="middle">deadpool-redis</text>
    <line x1="482" y1="254" x2="482" y2="304"
          stroke="#854F0B" stroke-width="1.5" stroke-opacity="0.7"
          marker-end="url(#arr)"/>

    <!-- ── POSTGRES ──────────────────────────────────────────────── -->
    <g class="layer">
      <rect x="60" y="312" width="256" height="94" rx="8"
            fill="rgba(15,110,86,0.13)" stroke="#0F6E56" stroke-width="0.8" stroke-opacity="0.6"/>
      <text class="node-title" x="188" y="348" text-anchor="middle">PostgreSQL 15 · :5432</text>
      <text class="node-sub" x="188" y="368" text-anchor="middle">users · complaints · licences</text>
      <text class="node-sub" x="188" y="386" text-anchor="middle">news · publications · faq</text>
    </g>

    <!-- ── REDIS ─────────────────────────────────────────────────── -->
    <g class="layer">
      <rect x="364" y="312" width="256" height="94" rx="8"
            fill="rgba(133,79,11,0.13)" stroke="#854F0B" stroke-width="0.8" stroke-opacity="0.6"/>
      <text class="node-title" x="492" y="348" text-anchor="middle">Redis 7 · :6379</text>
      <text class="node-sub" x="492" y="368" text-anchor="middle">session cache</text>
      <text class="node-sub" x="492" y="386" text-anchor="middle">rate limiting · token bucket</text>
    </g>

    <!-- ── CONNECTOR: DATA LAYERS → DOCKER ──────────────────────── -->
    <line x1="188" y1="406" x2="188" y2="436"
          stroke="rgba(255,255,255,0.2)" stroke-width="1"
          stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <line x1="492" y1="406" x2="492" y2="436"
          stroke="rgba(255,255,255,0.2)" stroke-width="1"
          stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <line x1="340" y1="406" x2="340" y2="436"
          stroke="rgba(255,255,255,0.2)" stroke-width="1"
          stroke-dasharray="4 3" marker-end="url(#arr)"/>

    <!-- ── DOCKER COMPOSE ────────────────────────────────────────── -->
    <rect x="60" y="444" width="560" height="62" rx="8"
          fill="rgba(68,68,65,0.18)" stroke="rgba(255,255,255,0.15)"
          stroke-width="0.8" stroke-dasharray="6 3"/>
    <text class="docker-title" x="340" y="470" text-anchor="middle">Docker Compose</text>
    <text class="docker-sub" x="340" y="490" text-anchor="middle">postgres · redis · bocra-api · bocra-web · volumes · healthchecks</text>
  </svg>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#1565C0"></div>
    <span>Frontend · React</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#534AB7"></div>
    <span>Backend · Rust</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#0F6E56"></div>
    <span>PostgreSQL</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#854F0B"></div>
    <span>Redis</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:rgba(255,255,255,0.3)"></div>
    <span>Docker Compose</span>
  </div>
</div>

<div class="footer-note">BOCRA Platform · bocra-platform v2.0 · March 2026</div>

</body>
</html>

version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bocra
      POSTGRES_USER: bocra
      POSTGRES_PASSWORD: bocradev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bocra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./bocra-api
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://bocra:bocradev@postgres:5432/bocra
    environment:
      DATABASE_URL: postgresql://bocra:bocradev@postgres:5432/bocra
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-256-bit-secret-in-production-minimum-32-chars
      JWT_ACCESS_EXPIRY_MINUTES: 15
      JWT_REFRESH_EXPIRY_DAYS: 7
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 8080
      RUST_LOG: bocra_api=debug,tower_http=debug
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./bocra-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
